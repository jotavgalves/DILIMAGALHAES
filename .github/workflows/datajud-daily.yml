name: DataJud diário

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  datajud-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Executar varredura diária autenticada
        shell: bash
        run: |
          set -euo pipefail
          TOKEN_JSON=$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=dilimagalhaes-daily")
          TOKEN=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$TOKEN_JSON")
          curl -fsSL -X POST \
            "https://dilimagalhaes.pages.dev/api/datajud-cron" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{}'
